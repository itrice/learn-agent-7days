version: '3.8'

services:
  python-dev:
    image: python:3.11-slim
    container_name: python-dev
    working_dir: /app
    volumes:
      - ./:/app
    # 可选端口，后面有web服务再放开
    # ports:
    #   - "8000:8000"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    command: bash
    tty: true
    stdin_open: true
